name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moonbit-community/setup-moonbit@main
        with:
          version: latest
      - run: moon check --deny-warn
      - run: moon test
      - run: moon fmt --check
